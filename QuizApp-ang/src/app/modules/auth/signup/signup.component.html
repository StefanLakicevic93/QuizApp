<div class="bg" style="background-color: #F8F8F8;">
    <div class="parent">
        <div class="child">
            <div nz-row class="imgDiv">
                <h1 style="margin-left: 80px;">Sign Up</h1>
            </div>

            <form nz-form [formGroup]="signupForm" (ngSubmit)="submitForm()">

                <nz-form-item>
                    <nz-form-control nzHasFeedback nzErrorTip="The input is not a valid name!">
                        <input nz-input placeholder="Name" formControlName="name"/>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-control nzHasFeedback nzErrorTip="The input is not a valid email!">
                        <input nz-input placeholder="E-mail" formControlName="email"/>
                    </nz-form-control>
                </nz-form-item>

                <nz-form-item>
                    <nz-form-control nzHasFeedback nzErrorTip="The input is not a valid password!">
                        <input nz-input type="password" placeholder="Password" formControlName="password"/>
                    </nz-form-control>
                </nz-form-item>

                <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Signup</button>
                 or <a routerLink="/login"> login now!</a>

            </form>

        </div>
    </div>
</div>
